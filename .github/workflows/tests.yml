name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q controller.py executor.py tests
      - name: Controller CLI smoke
        run: |
          python controller.py sample-task >/tmp/sample-task.json
          python controller.py validate-response --input /tmp/sample-task.json --repo-root . --guardrails guardrails.json
          python controller.py sanitize --text "safe text"
